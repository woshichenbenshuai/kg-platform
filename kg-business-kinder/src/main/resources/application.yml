server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: kg-business-kinder
  lifecycle:
    timeout-per-shutdown-phase: 30s
  sql:
    init:
      mode: never
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/kg_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

kg:
  security:
    jwt:
      secret: ${KG_JWT_SECRET}
      expire-seconds: ${KG_JWT_EXPIRE_SECONDS:86400}
  system-client:
    mode: ${KG_SYSTEM_CLIENT_MODE:local}
    service-name: ${KG_SYSTEM_SERVICE_NAME:kg-system}
    base-url: ${KG_SYSTEM_BASE_URL:http://127.0.0.1:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
