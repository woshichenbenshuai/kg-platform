apiVersion: apps/v1
kind: Deployment
metadata:
  name: kg-business-kinder
  namespace: kg-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kg-business-kinder
  template:
    metadata:
      labels:
        app: kg-business-kinder
    spec:
      containers:
        - name: kg-business-kinder
          image: your-registry/kg-business-kinder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: kg-platform-config
                  key: MYSQL_URL
            - name: MYSQL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: kg-platform-config
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kg-platform-secret
                  key: MYSQL_PASSWORD
            - name: KG_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kg-platform-secret
                  key: KG_JWT_SECRET
            - name: KG_JWT_EXPIRE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: kg-platform-config
                  key: KG_JWT_EXPIRE_SECONDS
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
